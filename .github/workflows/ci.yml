name: Node.js CI (Module Locataires)

on:
  push:
    branches: [ main, laarif-ahmed ]
  pull_request:
    branches: [ main, laarif-ahmed ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-locataire

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test --if-present
