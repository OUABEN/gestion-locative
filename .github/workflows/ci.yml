name: Node.js CI (Module Locataires)

on:
  push:
    branches: [ "main", "feature/**", "laarif-ahmed" ]
  pull_request:
    branches: [ "main", "laarif-ahmed" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-locataire

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'backend-locataire/package-lock.json'

    - name: Install dependencies
      working-directory: ./backend-locataire
      run: npm ci

    - name: Run 14 unit tests with Jest
      working-directory: ./backend-locataire
      run: npm test