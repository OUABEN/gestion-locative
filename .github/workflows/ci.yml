name: Java CI with Maven (Module Locataires)

on:
  push:
    branches: [ "main", "feature/**", "laarif-ahmed" ]
  pull_request:
    branches: [ "main", "laarif-ahmed" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: '**/pom.xml'

    - name: Build and run 14 unit tests with Maven
      working-directory: ./backend/backend_gestion_locataires
      run: mvn clean test --batch-mode

    - name: Generate Surefire test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports
        path: backend/backend_gestion_locataires/target/surefire-reports/