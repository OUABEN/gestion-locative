
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ biens, locataires, loyers, quittances ]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: db_gestion_locative
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d db_gestion_locative"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET: ci_secret_for_tests_only_0123456789abcdef
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: db_gestion_locative
      DB_USER: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/db_gestion_locative
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/db_gestion_locative
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.service == 'quittances' && '21' || '17' }}

      - name: Initialiser la base (scripts database/init)
        if: matrix.service != 'quittances'
        run: |
          for f in database/init/*.sql; do
            psql "postgresql://postgres:postgres@localhost:5432/db_gestion_locative" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Initialiser la base de tests Quittances
        if: matrix.service == 'quittances'
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE quittances_automatisation_test;"

      - name: Configurer les tests Quittances
        if: matrix.service == 'quittances'
        run: |
          {
            echo "QUITTANCES_DB_HOST=127.0.0.1"
            echo "QUITTANCES_DB_PORT=5432"
            echo "QUITTANCES_DB_NAME=quittances_automatisation_test"
            echo "QUITTANCES_DB_USER=postgres"
            echo "QUITTANCES_DB_PASSWORD=postgres"
            echo "SPRING_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5432/quittances_automatisation_test"
            echo "SPRING_FLYWAY_ENABLED=true"
            echo "SPRING_JPA_HIBERNATE_DDL_AUTO=validate"
          } >> "$GITHUB_ENV"

      - name: Tests du service ${{ matrix.service }}
        working-directory: backend/backend_gestion_${{ matrix.service }}
        run: |
          if [ -f package.json ]; then
            npm install
            npm test --if-present
          elif [ -f pom.xml ]; then
            mvn -B test
          else
            echo "Aucun projet Node ou Maven détecté dans ce dossier"; exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer, tester, construire
        working-directory: frontend
        run: |
          npm install
          npm test --if-present
          npm run build --if-present

  docker-compose:
    name: Validation docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la syntaxe du fichier compose
        run: |
          cp .env.example .env
          docker compose config -q
