# =====================================================================
# CD — Gestion Locative
# Après une CI réussie sur la branche main : construction des images
# Docker et publication sur GitHub Container Registry (ghcr.io).
# Un service n'est construit que si son Dockerfile ET son manifeste
# (package.json ou pom.xml) existent.
# =====================================================================
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Image ${{ matrix.service }}
    # CI réussie + branche main + push (exclut les pull requests)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend_gestion_biens
            context: backend/backend_gestion_biens
          - service: backend_gestion_locataires
            context: backend/backend_gestion_locataires
          - service: backend_gestion_loyers
            context: backend/backend_gestion_loyers
          - service: backend_gestion_quittances
            context: backend/backend_gestion_quittances
          - service: frontend
            context: frontend
    steps:
      - name: Checkout du commit validé par la CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # hashFiles() n'est pas utilisable dans le "if" d'un job (pas de
      # checkout à ce stade) : la condition est évaluée ici, après checkout.
      - name: Le service est-il prêt à être construit ?
        id: detect
        if: >-
          hashFiles(format('{0}/Dockerfile', matrix.context)) != '' &&
          (hashFiles(format('{0}/package.json', matrix.context)) != '' ||
           hashFiles(format('{0}/pom.xml', matrix.context)) != '')
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Service ignoré
        if: steps.detect.outputs.ready != 'true'
        run: |
          echo "::notice::${{ matrix.service }} - Dockerfile ou package.json/pom.xml absent, image non construite."

      - name: Nom de l'image (owner en minuscules)
        id: image
        if: steps.detect.outputs.ready == 'true'
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        if: steps.detect.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io
        if: steps.detect.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        if: steps.detect.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.title=${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
