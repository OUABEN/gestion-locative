# =====================================================================
# Configuration SonarQube Scanner — Module Gestion des Biens
# =====================================================================
sonar.projectKey=gestion-locative-biens
sonar.projectName=Gestion Locative - Module Biens
sonar.projectVersion=2.0.0
sonar.sourceEncoding=UTF-8

# Modules analysés (Backend TypeScript + Frontend React)
sonar.modules=backend,frontend

# ---------------------------------------------------------------------
# Configuration Module Backend
# ---------------------------------------------------------------------
backend.sonar.projectName=Module Biens - Backend API
backend.sonar.sources=../../backend/backend_gestion_biens/src
backend.sonar.tests=../../backend/backend_gestion_biens/tests
backend.sonar.inclusions=**/*.ts,**/*.js
backend.sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.test.ts
backend.sonar.typescript.tsconfigPath=../../backend/backend_gestion_biens/tsconfig.json

# Rapports de couverture et de tests backend
backend.sonar.javascript.lcov.reportPaths=../../docs/qualite/biens/istanbul-backend-integration/lcov.info,../../docs/qualite/biens/istanbul-backend-unit/lcov.info
backend.sonar.testExecutionReportPaths=../../docs/rapports/biens/TEST-BienService.xml,../../docs/rapports/biens/TEST-BiensIntegration.xml

# ---------------------------------------------------------------------
# Configuration Module Frontend
# ---------------------------------------------------------------------
frontend.sonar.projectName=Module Biens - Frontend React
frontend.sonar.sources=../../frontend/src
frontend.sonar.tests=../../frontend/src/tests
frontend.sonar.inclusions=**/*.js,**/*.jsx,**/*.ts,**/*.tsx,**/*.css
frontend.sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.jsx,**/*.test.js

# Rapports de couverture et de tests frontend
frontend.sonar.javascript.lcov.reportPaths=../../docs/qualite/biens/istanbul-frontend/lcov.info
frontend.sonar.testExecutionReportPaths=../../docs/rapports/biens/TEST-FrontendBiens.xml

# ---------------------------------------------------------------------
# Critères Quality Gate cibles
# ---------------------------------------------------------------------
# - Coverage > 80%
# - Security Rating = A
# - Reliability Rating = A
# - Maintainability Rating = A
# - Duplicated Lines < 3%
