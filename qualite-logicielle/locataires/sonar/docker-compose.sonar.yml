version: '3.8'

services:
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube-locataires
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
      - SONAR_JDBC_URL=jdbc:postgresql://db-sonar:5432/sonar
    depends_on:
      - db-sonar
    networks:
      - sonar-net

  db-sonar:
    image: postgres:15-alpine
    container_name: db-sonar-locataires
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    networks:
      - sonar-net

networks:
  sonar-net:
    driver: bridge
