# =====================================================================
# Configuration SonarQube Scanner — Module Gestion des Locataires & Baux
# Auteur : Ahmed LAARIF — Groupe 16 (Université Ibn Zohr Agadir - FSA)
# =====================================================================
sonar.projectKey=gestion-locative-locataires
sonar.projectName=Gestion Locative - Module Locataires & Baux
sonar.projectVersion=2.0.0
sonar.sourceEncoding=UTF-8

# Modules analysés (Backend Node.js/Express + Frontend React Locataires)
sonar.modules=backend,frontend

# ---------------------------------------------------------------------
# Configuration Module Backend (Node.js 20 / Express 4)
# ---------------------------------------------------------------------
backend.sonar.projectName=Module Locataires - Backend API (Port 8082)
backend.sonar.sources=../../backend/backend_gestion_locataires/src
backend.sonar.tests=../../backend/backend_gestion_locataires/tests
backend.sonar.inclusions=**/*.js
backend.sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.js,**/coverage/**,**/swagger.js

# Rapports de couverture Istanbul / LCOV Backend
backend.sonar.javascript.lcov.reportPaths=../../backend/backend_gestion_locataires/coverage/lcov.info,../../docs/qualite/locataires/istanbul-backend/lcov.info

# ---------------------------------------------------------------------
# Configuration Module Frontend (React 18 / Pages Locataires)
# ---------------------------------------------------------------------
frontend.sonar.projectName=Module Locataires - Frontend React
frontend.sonar.sources=../../frontend/src/pages/locataires,../../frontend/src/api/locatairesApi.js
frontend.sonar.tests=../../frontend/src/tests/locataires.frontend.test.jsx
frontend.sonar.inclusions=**/*.js,**/*.jsx,**/*.css
frontend.sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.jsx

# ---------------------------------------------------------------------
# Critères Quality Gate Cibles (Standards Qualité Logicielle)
# ---------------------------------------------------------------------
# - Coverage > 65% (Aligné sur mesure réelle Istanbul 65.24%)
# - Security Rating = A (0 vulnérabilité npm audit)
# - Reliability Rating = A
# - Maintainability Rating = A
# - Duplicated Lines < 3%
