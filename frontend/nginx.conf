# =====================================================================
# nginx — frontend React (SPA) + reverse proxy vers les microservices
# Ce fichier est un template : les ${..._SERVICE_URL} sont remplacés
# au démarrage du conteneur par les variables d'environnement.
# =====================================================================
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # DNS interne Docker : résolution des noms de service à la requête
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # En-têtes transmis aux microservices (dont Authorization / JWT)
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---------- Reverse proxy : Module Biens & Auth ----------
    location /api/biens {
        set $upstream_biens ${BIENS_SERVICE_URL};
        proxy_pass $upstream_biens;
    }

    location /api/auth {
        set $upstream_biens ${BIENS_SERVICE_URL};
        proxy_pass $upstream_biens;
    }

    # ---------- Autres microservices de la plateforme ----------
    location /api/locataires/ {
        set $upstream_locataires ${LOCATAIRES_SERVICE_URL};
        rewrite ^/api/locataires/(.*)$ /$1 break;
        proxy_pass $upstream_locataires;
    }

    location /api/loyers/ {
        set $upstream_loyers ${LOYERS_SERVICE_URL};
        rewrite ^/api/loyers/(.*)$ /$1 break;
        proxy_pass $upstream_loyers;
    }

    location /api/quittances/ {
        set $upstream_quittances ${QUITTANCES_SERVICE_URL};
        rewrite ^/api/quittances/(.*)$ /$1 break;
        proxy_pass $upstream_quittances;
    }

    # ---------- Fichiers statiques ----------
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---------- Fallback SPA : toute route inconnue -> index.html ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
