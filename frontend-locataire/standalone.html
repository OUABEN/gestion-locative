                  <div className="flex justify-between items-start mb-3">

                    <span className="text-[10px] font-mono font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">Garanti 100%</span>
                  </div>
                  <div className="text-xs font-bold text-slate-500 uppercase">Dépôts de Garantie</div>
                  <div className="text-3xl font-black text-midnight mt-1 font-mono">248 500 DH</div>
                  <div className="text-[11px] text-slate-400 mt-1">Séquestre et cautions sécurisées</div>
                  <div className="w-full h-1.5 bg-slate-100 rounded-full mt-3 overflow-hidden">
                    <div className="h-full bg-lime rounded-full" style={{ width: '88%' }}></div>
                  </div>
                </div>

                {/* 6. Loyers sous Contrat (Midnight Black) */}
                <div className="bg-midnight text-white rounded-card p-6 border border-midnight-border shadow-midnight-card">
                  <div className="flex justify-between items-start mb-3">
                    <div className="w-11 h-11 rounded-[14px] bg-lime flex items-center justify-center font-bold text-midnight text-lg shadow-lime-sm">💰</div>
                    <span className="text-[10px] font-mono font-bold bg-lime text-midnight px-2 py-0.5 rounded-full">Flux Actif</span>
                  </div>
                  <div className="text-xs font-bold text-slate-400 uppercase">Loyers sous Contrat</div>
                  <div className="text-3xl font-black text-lime mt-1 font-mono">312 000 DH</div>
                  <div className="text-[11px] text-slate-400 mt-1">Revenus locatifs mensuels garantis</div>
                  <div className="w-full h-1.5 bg-midnight-elevated rounded-full mt-3 overflow-hidden">
                    <div className="h-full bg-lime rounded-full" style={{ width: '92%' }}></div>
                  </div>
                </div>
              </div>

              {/* ANALYTICS SECTION */}
              {activeTab === 'dashboard' && (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                  {/* Midnight Chart Card */}
                  <div className="lg:col-span-2 rounded-card bg-midnight p-6 border border-midnight-border text-white shadow-midnight-card">
                    <div className="flex justify-between items-center mb-4">
                      <div>
                        <h3 className="text-base font-extrabold text-white">Évolution des Loyers & Encaissements 2026</h3>
                        <p className="text-xs text-slate-400">Flux récurrents en Dirham Marocain (DH)</p>
                      </div>
                      <span className="text-lime font-mono text-xs font-bold bg-midnight-elevated px-3 py-1 rounded-full border border-midnight-border">312 000 DH / mois</span>
                    </div>

                    {/* Chart Mock */}
                    <div className="h-44 flex items-end justify-between space-x-2 pt-6 pb-2 border-b border-midnight-border">
                      {['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Juin', 'Juil', 'Août', 'Sept', 'Oct', 'Nov'].map((m, idx) => {
                        const heights = [65, 70, 75, 80, 85, 92, 92, 95, 98, 100, 100];
                        const h = heights[idx];
                        return (
                          <div key={idx} className="flex-1 flex flex-col items-center gap-1.5">
                            <div className="w-full bg-midnight-elevated rounded-t-lg relative flex items-end justify-center" style={{ height: '120px' }}>
                              <div className="w-4/5 bg-lime rounded-t-md transition-all shadow-lime-sm" style={{ height: `${h}%` }}></div>
                            </div>
                            <span className="text-[10px] text-slate-400 font-mono">{m}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* Donut Chart Card */}
                  <div className="rounded-card bg-white p-6 border border-slate-200 shadow-card-soft flex flex-col justify-between">
                    <div>
                      <h3 className="text-base font-extrabold text-midnight">Répartition Géographique</h3>
                      <p className="text-xs text-slate-500 mb-4">Portefeuille par ville marocaine</p>
                      <div className="space-y-2.5 text-xs">
                        <div className="flex justify-between items-center p-2 rounded-lg bg-slate-50">
                          <span className="font-bold flex items-center"><span className="w-2.5 h-2.5 rounded-full bg-lime mr-2"></span>Casablanca</span>
                          <span className="font-mono font-bold">50% (24 baux)</span>
                        </div>
                        <div className="flex justify-between items-center p-2 rounded-lg bg-slate-50">
                          <span className="font-bold flex items-center"><span className="w-2.5 h-2.5 rounded-full bg-midnight mr-2"></span>Rabat</span>
                          <span className="font-mono font-bold">25% (12 baux)</span>
                        </div>
                        <div className="flex justify-between items-center p-2 rounded-lg bg-slate-50">
                          <span className="font-bold flex items-center"><span className="w-2.5 h-2.5 rounded-full bg-sky-500 mr-2"></span>Marrakech</span>
                          <span className="font-mono font-bold">17% (8 baux)</span>
                        </div>
                        <div className="flex justify-between items-center p-2 rounded-lg bg-slate-50">
                          <span className="font-bold flex items-center"><span className="w-2.5 h-2.5 rounded-full bg-slate-400 mr-2"></span>Tanger</span>
                          <span className="font-mono font-bold">8% (4 baux)</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* TABLE CATALOGUE */}
              {activeTab !== 'new' && (
                <div className="rounded-card bg-white border border-slate-200 shadow-card-soft overflow-hidden">
                  <div className="p-4 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-3 bg-slate-50/50">
                    <input
                      type="text"
                      placeholder="Rechercher par CIN (ex: AB123456), nom ou ville..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="w-full max-w-md px-3.5 py-2 text-xs border border-slate-200 rounded-button bg-white focus:outline-none focus:ring-2 focus:ring-midnight"
                    />

                    <div className="flex items-center space-x-2">
                      <div className="bg-slate-200/80 p-1 rounded-full text-xs font-bold">
                        <button onClick={() => setFilterStatut('ALL')} className={`px-3 py-1 rounded-full ${filterStatut === 'ALL' ? 'bg-midnight text-white' : ''}`}>Tous ({locataires.length})</button>
                        <button onClick={() => setFilterStatut('ACTIF')} className={`px-3 py-1 rounded-full ${filterStatut === 'ACTIF' ? 'bg-lime text-midnight' : ''}`}>ACTIF</button>
                        <button onClick={() => setFilterStatut('TERMINE')} className={`px-3 py-1 rounded-full ${filterStatut === 'TERMINE' ? 'bg-midnight text-white' : ''}`}>TERMINÉ</button>
                      </div>

                      <button onClick={() => setActiveTab('new')} className="px-4 py-2 bg-lime hover:bg-lime-hover text-midnight text-xs font-black rounded-button shadow-lime-sm">
                        + Nouveau bail
                      </button>
                    </div>
                  </div>

                  {/* 8 Strict Columns Table */}
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs border-collapse">
                      <thead>
                        <tr className="bg-slate-100 text-[10px] uppercase font-extrabold text-slate-500 border-b">
                          <th className="py-3 px-4">Nom & Prénom</th>
                          <th className="py-3 px-4">CIN</th>
                          <th className="py-3 px-4">Téléphone & Email</th>
                          <th className="py-3 px-4">Bien Rattaché (Adresse & Ville)</th>
                          <th className="py-3 px-4 text-right">Montant Loyer</th>
                          <th className="py-3 px-4 text-right">Dépôt Garantie</th>
                          <th className="py-3 px-4">Dates (Début / Fin)</th>
                          <th className="py-3 px-4 text-center">Statut Bail</th>
                          <th className="py-3 px-4 text-right">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {filtered.map(item => {
                          const isActif = item.statutBail === 'ACTIF';
                          return (
                            <tr key={item.id} className="hover:bg-slate-50">
                              <td className="py-3 px-4 font-extrabold text-midnight">
                                {item.prenom} {item.nom}
                                <div className="text-[10px] text-slate-400 font-mono font-normal">{item.id.substring(0, 11)}...</div>
                              </td>
                              <td className="py-3 px-4 font-mono font-bold">
                                <span className="bg-slate-100 px-2 py-0.5 rounded border border-slate-200">{item.cin}</span>
                              </td>
                              <td className="py-3 px-4">
                                <div className="font-semibold">{item.telephone}</div>
                                <div className="text-slate-400 text-[11px]">{item.email}</div>
                              </td>
                              <td className="py-3 px-4">
                                <div className="font-bold text-slate-800">{item.bien.titre}</div>
                                <div className="text-slate-500 text-[11px]">{item.bien.ville} • {item.bien.adresse}</div>
                              </td>
                              <td className="py-3 px-4 text-right font-mono font-black text-midnight whitespace-nowrap">
                                {item.loyerMensuel.toLocaleString('fr-FR')} DH
                              </td>
                              <td className="py-3 px-4 text-right font-mono font-bold text-slate-700 whitespace-nowrap">
                                {item.depotGarantie.toLocaleString('fr-FR')} DH
                              </td>
                              <td className="py-3 px-4 font-mono text-[11px] text-slate-600 whitespace-nowrap">
                                {item.dateDebut} → {item.dateFin}
                              </td>
                              <td className="py-3 px-4 text-center whitespace-nowrap">
                                {isActif ? (
                                  <span className="px-3 py-1 rounded-full text-[11px] font-black bg-lime text-midnight font-mono shadow-lime-sm">
                                    ● ACTIF
                                  </span>
                                ) : (
                                  <span className="px-3 py-1 rounded-full text-[11px] font-bold bg-midnight text-white font-mono">
                                    ● TERMINE
                                  </span>
                                )}
                              </td>
                              <td className="py-3 px-4 text-right space-x-1.5 whitespace-nowrap">
                                <button onClick={() => setQuittanceModal(item)} className="px-2.5 py-1 bg-lime/20 text-midnight hover:bg-lime rounded text-[11px] font-bold">
                                  Quittances
                                </button>
                                <button onClick={() => {
                                  if (isActif) {
                                    alert("Suppression impossible : Un bail actif est rattaché à ce locataire. Clôturez d'abord le bail dans le module Biens.");
                                  } else {
                                    setLocataires(locataires.filter(l => l.id !== item.id));
                                    showToast("Locataire archivé.");
                                  }
                                }} className={`px-2 py-1 rounded text-[11px] font-bold ${isActif ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-red-50 text-coral hover:bg-red-100'}`}>
                                  {isActif ? '🔒 Verrouillé' : 'Supprimer'}
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* QUICK-CHOICE TAB 3 : NOUVEAU LOCATAIRE / BAIL */}
              {activeTab === 'new' && (
                <div className="rounded-card bg-white border border-slate-200 shadow-card-soft p-6 sm:p-8">
                  <div className="flex justify-between items-center pb-4 mb-6 border-b">
                    <div>
                      <h2 className="text-2xl font-black text-midnight tracking-tight">Nouveau Locataire & Contrat de Bail</h2>
                      <p className="text-xs text-slate-500">Enregistrement centralisé avec contrôle strict d'unicité du CIN marocain.</p>
                    </div>
                    <button onClick={() => setActiveTab('list')} className="px-3 py-1.5 bg-slate-100 rounded-button text-xs font-bold text-slate-600">
                      Annuler
                    </button>
                  </div>

                  <form onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    const cinVal = form.cin.value.trim().toUpperCase();
                    if (locataires.some(l => l.cin.toUpperCase() === cinVal)) {
                      alert(`Fiche refusée : CIN déjà utilisé (${cinVal}) - Erreur HTTP 409 Conflict`);
                      return;
                    }
                    const newRecord = {
                      id: "loc-" + Date.now().toString(36),
                      nom: form.nom.value.trim(),
                      prenom: form.prenom.value.trim(),
                      cin: cinVal,
                      telephone: form.telephone.value.trim(),
                      email: form.email.value.trim(),
                      bien: {
                        titre: form.bienTitre.value.trim(),
                        adresse: form.bienAdresse.value.trim(),
                        ville: form.bienVille.value
                      },
                      loyerMensuel: Number(form.loyerMensuel.value),
                      depotGarantie: Number(form.depotGarantie.value),
                      dateDebut: form.dateDebut.value,
                      dateFin: form.dateFin.value,
                      statutBail: "ACTIF"
                    };
                    setLocataires([newRecord, ...locataires]);
                    setActiveTab('list');
                    showToast(`Bail activé pour ${newRecord.prenom} ${newRecord.nom} (${newRecord.loyerMensuel} DH) !`);
                  }} className="space-y-6 text-xs">
                    
                    {/* Section 1 */}
                    <div className="space-y-3">
                      <div className="font-extrabold text-midnight uppercase tracking-wider text-xs flex items-center">
                        <span className="w-5 h-5 rounded-full bg-midnight text-lime flex items-center justify-center mr-2 text-[10px]">1</span>
                        Identité du locataire
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                          <label className="font-bold block mb-1">Nom (*)</label>
                          <input name="nom" required className="w-full p-2.5 border rounded-button bg-slate-50" placeholder="ex. Naciri" />
                        </div>
                        <div>
                          <label className="font-bold block mb-1">Prénom (*)</label>
                          <input name="prenom" required className="w-full p-2.5 border rounded-button bg-slate-50" placeholder="ex. Samir" />
                        </div>
                        <div>
                          <label className="font-bold block mb-1">CIN (*) [Test doublon: AB123456]</label>
                          <input name="cin" required className="w-full p-2.5 border rounded-button bg-slate-50 font-mono uppercase" placeholder="ex. EF345678" />
                        </div>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="font-bold block mb-1">Téléphone marocain (*)</label>
                          <input name="telephone" required className="w-full p-2.5 border rounded-button bg-slate-50" placeholder="+212 6 63 11 22 33" />
                        </div>
                        <div>
                          <label className="font-bold block mb-1">Email (*)</label>
                          <input name="email" type="email" required className="w-full p-2.5 border rounded-button bg-slate-50" placeholder="samir.naciri@mail.ma" />
                        </div>
                      </div>
                    </div>

                    {/* Section 2 */}
                    <div className="space-y-3 pt-4 border-t">
                      <div className="font-extrabold text-midnight uppercase tracking-wider text-xs flex items-center">
                        <span className="w-5 h-5 rounded-full bg-midnight text-lime flex items-center justify-center mr-2 text-[10px]">2</span>
                        Bien Immobilier & Modalités Financières (DH)
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                          <label className="font-bold block mb-1">Titre de l'appartement (*)</label>
                          <input name="bienTitre" defaultValue="Appartement C-05 Standing" required className="w-full p-2.5 border rounded-button bg-slate-50" />
                        </div>
                        <div>
                          <label className="font-bold block mb-1">Adresse (*)</label>
                          <input name="bienAdresse" defaultValue="Boulevard Zerktouni, Gauthier" required className="w-full p-2.5 border rounded-button bg-slate-50" />
                        </div>
                        <div>
                          <label className="font-bold block mb-1">Ville (*)</label>
                          <select name="bienVille" className="w-full p-2.5 border rounded-button bg-slate-50 font-bold">
                            <option value="Casablanca">Casablanca</option>
                            <option value="Rabat">Rabat</option>
                            <option value="Marrakech">Marrakech</option>
                            <option value="Tanger">Tanger</option>
                          </select>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                        <div>
                          <label className="font-bold block mb-1">Loyer Mensuel (DH) (*)</label>
                          <input name="loyerMensuel" type="number" defaultValue="7500" required className="w-full p-2.5 border rounded-button bg-slate-50 font-mono font-bold" />
                        </div>
                        <div>
                          <label className="font-bold block mb-1">Dépôt Garantie (DH) (*)</label>
                          <input name="depotGarantie" type="number" defaultValue="15000" required className="w-full p-2.5 border rounded-button bg-slate-50 font-mono font-bold" />
                        </div>
                        <div>
                          <label className="font-bold block mb-1">Date Début (*)</label>
                          <input name="dateDebut" defaultValue="01/01/2026" required className="w-full p-2.5 border rounded-button bg-slate-50 font-mono" />
                        </div>
                        <div>
                          <label className="font-bold block mb-1">Date Fin (*)</label>
                          <input name="dateFin" defaultValue="31/12/2027" required className="w-full p-2.5 border rounded-button bg-slate-50 font-mono" />
                        </div>
                      </div>
                    </div>

                    <div className="pt-4 border-t flex justify-end space-x-3">
                      <button type="button" onClick={() => setActiveTab('list')} className="px-5 py-2.5 border rounded-button font-bold text-slate-700">Annuler</button>
                      <button type="submit" className="px-6 py-2.5 bg-lime hover:bg-lime-hover text-midnight rounded-button font-black uppercase tracking-wider shadow-lime-sm">
                        Enregistrer et Activer le bail (DH)
                      </button>
                    </div>

                  </form>
                </div>
              )}

            </main>

            {/* FOOTER */}
            <footer className="border-t border-slate-200 py-4 px-8 text-xs text-slate-500 bg-white flex justify-between items-center">
              <div><strong>LOCATIVE.</strong> — Gestion Immobilière Marocaine (Master Web Services · Groupe 16)</div>
              <div className="font-mono text-lime-dark font-bold">Midnight & Lime Edition v2.0</div>
            </footer>

          </div>

          {/* QUITTANCE MODAL */}
          {quittanceModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop">
              <div className="bg-white rounded-card p-6 max-w-lg w-full space-y-4 shadow-2xl border">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-extrabold text-sm text-midnight">Passerelle Quittances (Module Akram)</h3>
                  <button onClick={() => setQuittanceModal(null)} className="text-slate-400 font-bold">✕</button>
                </div>
                <div className="text-xs text-slate-600">
                  Flux JSON transmis via l'endpoint <code className="bg-slate-100 px-1 py-0.5 rounded font-mono text-[11px]">GET /api/v1/locataires/:id/quittance-summary</code> :
                </div>
                <pre className="bg-midnight p-4 rounded-xl text-emerald-400 font-mono text-xs overflow-x-auto">
                  {JSON.stringify({
                    id: quittanceModal.id,
                    nom: quittanceModal.nom,
                    prenom: quittanceModal.prenom,
                    nomComplet: `${quittanceModal.prenom} ${quittanceModal.nom}`,
                    cin: quittanceModal.cin,
                    loyerMensuelDH: quittanceModal.loyerMensuel,
                    bien: quittanceModal.bien.titre,
                    ville: quittanceModal.bien.ville
                  }, null, 2)}
                </pre>
                <div className="flex justify-end pt-2 border-t">
                  <button onClick={() => setQuittanceModal(null)} className="px-4 py-2 bg-midnight text-white rounded-button font-bold text-xs">Fermer</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
