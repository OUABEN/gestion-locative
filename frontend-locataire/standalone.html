<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des Locataires — Démonstration Frontend (LAARIF Ahmed)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              50: '#F0F5FA',
              100: '#E1EBF5',
              600: '#255A97',
              700: '#1F4E79',
              800: '#1A4064',
              900: '#163653',
              950: '#0E2236',
            },
            surface: '#F8FAFC',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #F8FAFC; font-family: 'Inter', sans-serif; }
    .card-shadow { box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.05), 0 1px 2px -1px rgb(0 0 0 / 0.05); }
    .modal-backdrop { background-color: rgba(15, 23, 42, 0.55); backdrop-filter: blur(4px); }
  </style>
</head>
<body class="min-h-screen text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const initialLocataires = [
      {
        id: "c1f7b823-3f1d-405a-87f1-79b8c0a969e2",
        nom: "El Amrani",
        prenom: "Yassine",
        cin: "AB123456",
        email: "yassine.elamrani@mail.ma",
        telephone: "+212 6 61 00 11 22",
        hasBailActif: true,
        bailInfo: { appartement: "Apt B-12 (3e étage)", residence: "Résidence Al Mansour, Casablanca", loyerMensuel: 4800 },
        piecesJustificatives: [{ nom: "CIN_ElAmrani_RectoVerso.pdf", taille: "1.4 Mo" }, { nom: "Contrat_Travail_CDI.pdf", taille: "2.1 Mo" }]
      },
      {
        id: "8d9e2b14-6c3f-4e89-a1b2-3c4d5e6f7a8b",
        nom: "Bennani",
        prenom: "Fatima Zahra",
        cin: "CD789012",
        email: "fatima.bennani@mail.ma",
        telephone: "+212 6 62 33 44 55",
        hasBailActif: true,
        bailInfo: { appartement: "Apt C-04 (1er étage)", residence: "Les Jardins de l'Agdal, Rabat", loyerMensuel: 5500 },
        piecesJustificatives: [{ nom: "CIN_Bennani_FZ.pdf", taille: "1.2 Mo" }, { nom: "Attestation_Titularisation.pdf", taille: "850 Ko" }]
      },
      {
        id: "5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d",
        nom: "Benjelloun",
        prenom: "Mehdi",
        cin: "EF345678",
        email: "mehdi.benjelloun@mail.ma",
        telephone: "+212 6 61 22 33 44",
        hasBailActif: true,
        bailInfo: { appartement: "Apt A-01 (RDC)", residence: "Le Carré Majorelle, Marrakech", loyerMensuel: 4200 },
        piecesJustificatives: [{ nom: "CIN_Benjelloun_M.pdf", taille: "1.8 Mo" }]
      },
      {
        id: "2f3a4b5c-6d7e-4f8a-9b0c-1d2e3f4a5b6c",
        nom: "Tazi",
        prenom: "Kenza",
        cin: "GH901234",
        email: "kenza.tazi@mail.ma",
        telephone: "+212 6 64 55 66 77",
        hasBailActif: false,
        bailInfo: null,
        piecesJustificatives: [{ nom: "CIN_Tazi_Kenza.pdf", taille: "980 Ko" }, { nom: "Dossier_Candidature.pdf", taille: "3.2 Mo" }]
      }
    ];

    function App() {
      const [locataires, setLocataires] = useState(initialLocataires);
      const [activeTab, setActiveTab] = useState('repertoire');
      const [searchTerm, setSearchTerm] = useState('');
      const [filterStatut, setFilterStatut] = useState('ALL');

      // Modales
      const [isCreateOpen, setIsCreateOpen] = useState(false);
      const [detailLocataire, setDetailLocataire] = useState(null);
      const [editLocataire, setEditLocataire] = useState(null);
      const [deleteLocataire, setDeleteLocataire] = useState(null);
      const [toast, setToast] = useState('');

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 3000);
      };

      const existingCins = locataires.map(l => l.cin.toUpperCase());

      const filtered = locataires.filter(l => {
        const s = searchTerm.toLowerCase();
        const match = l.cin.toLowerCase().includes(s) || l.nom.toLowerCase().includes(s) || l.prenom.toLowerCase().includes(s) || l.email.toLowerCase().includes(s);
        if (!match) return false;
        if (filterStatut === 'ACTIF') return l.hasBailActif;
        if (filterStatut === 'SANS_BAIL') return !l.hasBailActif;
        return true;
      });

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-navy-700 text-white shadow-md border-b border-navy-800 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-lg bg-navy-600 flex items-center justify-center font-bold text-sky-300">
                  GL
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="font-bold text-lg">Gestion Locative</span>
                    <span className="bg-navy-900 text-sky-300 text-xs px-2 py-0.5 rounded-full font-semibold">Groupe 16</span>
                  </div>
                  <p className="text-xs text-slate-300">Module 02 : Gestion des locataires — <strong>LAARIF Ahmed</strong></p>
                </div>
              </div>
              <div className="flex items-center space-x-3">
                <div className="bg-navy-800 rounded-lg p-1 text-xs">
                  <button onClick={() => setActiveTab('repertoire')} className={`px-3 py-1.5 rounded-md ${activeTab === 'repertoire' ? 'bg-sky-500 text-white font-semibold' : 'text-slate-300'}`}>
                    Répertoire ({locataires.length})
                  </button>
                  <button onClick={() => setActiveTab('interop')} className={`px-3 py-1.5 rounded-md ${activeTab === 'interop' ? 'bg-sky-500 text-white font-semibold' : 'text-slate-300'}`}>
                    Interopérabilité Quittances
                  </button>
                </div>
                <div className="bg-navy-800/80 px-3 py-1.5 rounded-full text-[11px] text-slate-200 flex items-center space-x-1.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                  <span className="font-mono">API :8082</span>
                </div>
              </div>
            </div>
          </header>

          {/* Toast */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 bg-navy-900 text-white px-4 py-3 rounded-xl shadow-2xl text-xs flex items-center space-x-2 border border-navy-700">
              <span className="text-emerald-400 font-bold">✓</span>
              <span>{toast}</span>
            </div>
          )}

          <main className="max-w-7xl mx-auto px-4 py-6 w-full flex-1">
            {/* Stats */}
            <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-6">
              <div className="bg-white p-4 rounded-xl border border-slate-200 card-shadow">
                <div className="text-xs uppercase text-slate-400 font-bold">Référentiel Fiches</div>
                <div className="text-2xl font-bold text-navy-700 mt-1">{locataires.length}</div>
                <div className="text-[11px] text-slate-400">Locataires actifs</div>
              </div>
              <div className="bg-white p-4 rounded-xl border border-slate-200 card-shadow">
                <div className="text-xs uppercase text-emerald-600 font-bold">Baux Actifs</div>
                <div className="text-2xl font-bold text-emerald-700 mt-1">{locataires.filter(l => l.hasBailActif).length}</div>
                <div className="text-[11px] text-slate-400">Biens rattachés</div>
              </div>
              <div className="bg-white p-4 rounded-xl border border-slate-200 card-shadow">
                <div className="text-xs uppercase text-amber-600 font-bold">Sans Bail</div>
                <div className="text-2xl font-bold text-amber-700 mt-1">{locataires.filter(l => !l.hasBailActif).length}</div>
                <div className="text-[11px] text-slate-400">En attente d'affectation</div>
              </div>
              <div className="bg-white p-4 rounded-xl border border-slate-200 card-shadow">
                <div className="text-xs uppercase text-sky-600 font-bold">Intégrité Clé Métier</div>
                <div className="text-2xl font-bold text-sky-700 mt-1">100 %</div>
                <div className="text-[11px] text-slate-400">Unicité CIN vérifiée</div>
              </div>
            </div>

            {activeTab === 'repertoire' ? (
              <div className="bg-white rounded-xl border border-slate-200 card-shadow overflow-hidden">
                <div className="p-4 border-b border-slate-100 flex flex-col sm:flex-row gap-3 justify-between items-center bg-slate-50/50">
                  <div className="relative w-full max-w-md">
                    <input
                      type="text"
                      placeholder="Rechercher par CIN (ex. AB123456), Nom, Prénom..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-navy-600"
                    />
                  </div>
                  <div className="flex items-center space-x-2">
                    <div className="bg-white border border-slate-200 rounded-lg p-1 text-xs">
                      <button onClick={() => setFilterStatut('ALL')} className={`px-2.5 py-1 rounded ${filterStatut === 'ALL' ? 'bg-navy-700 text-white font-bold' : ''}`}>Tous</button>
                      <button onClick={() => setFilterStatut('ACTIF')} className={`px-2.5 py-1 rounded ${filterStatut === 'ACTIF' ? 'bg-emerald-600 text-white font-bold' : ''}`}>Bail Actif</button>
                      <button onClick={() => setFilterStatut('SANS_BAIL')} className={`px-2.5 py-1 rounded ${filterStatut === 'SANS_BAIL' ? 'bg-amber-600 text-white font-bold' : ''}`}>Sans Bail</button>
                    </div>
                    <button onClick={() => setIsCreateOpen(true)} className="px-4 py-2 bg-navy-700 hover:bg-navy-800 text-white rounded-lg text-sm font-semibold shadow-sm">
                      + Nouveau locataire
                    </button>
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse text-sm">
                    <thead>
                      <tr className="bg-slate-100/70 border-b border-slate-200 text-[11px] font-bold text-slate-500 uppercase">
                        <th className="py-3 px-4">CIN (Clé Métier)</th>
                        <th className="py-3 px-4">Locataire</th>
                        <th className="py-3 px-4">Contact</th>
                        <th className="py-3 px-4">Statut Bail</th>
                        <th className="py-3 px-4 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {filtered.map(l => (
                        <tr key={l.id} className="hover:bg-slate-50">
                          <td className="py-3 px-4 font-mono font-bold text-navy-700">
                            <span className="bg-slate-100 px-2 py-0.5 rounded border border-slate-200 text-xs">{l.cin}</span>
                          </td>
                          <td className="py-3 px-4 font-semibold text-slate-800">
                            {l.prenom} {l.nom}
                            <div className="text-[11px] text-slate-400 font-mono font-normal">{l.id.substring(0,8)}...</div>
                          </td>
                          <td className="py-3 px-4 text-xs">
                            <div>{l.telephone}</div>
                            <div className="text-slate-400">{l.email}</div>
                          </td>
                          <td className="py-3 px-4">
                            {l.hasBailActif ? (
                              <span className="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-0.5 rounded-full font-semibold">
                                Bail Actif ({l.bailInfo?.appartement})
                              </span>
                            ) : (
                              <span className="text-xs bg-amber-50 text-amber-700 border border-amber-200 px-2.5 py-0.5 rounded-full font-semibold">
                                Sans bail
                              </span>
                            )}
                          </td>
                          <td className="py-3 px-4 text-right space-x-1">
                            <button onClick={() => setDetailLocataire(l)} className="px-2.5 py-1 bg-slate-100 hover:bg-navy-50 text-navy-700 rounded text-xs font-semibold">Voir</button>
                            <button onClick={() => setEditLocataire(l)} className="px-2.5 py-1 bg-sky-50 hover:bg-sky-100 text-sky-700 rounded text-xs font-semibold">Modifier</button>
                            <button onClick={() => setDeleteLocataire(l)} className="px-2.5 py-1 bg-red-50 hover:bg-red-100 text-red-700 rounded text-xs font-semibold">Supprimer</button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            ) : (
              /* Vue Interopérabilité Quittances */
              <div className="space-y-4">
                <div className="bg-slate-900 text-white p-6 rounded-2xl shadow-xl">
                  <h3 className="text-lg font-bold text-sky-400">Passerelle Quittances (GET /api/v1/locataires/:id/quittance-summary)</h3>
                  <p className="text-xs text-slate-300 mt-1">Fournit l'identité certifiée sans exposer les documents privés.</p>
                  <pre className="bg-black/60 p-4 rounded-xl text-emerald-400 font-mono text-xs mt-4 overflow-x-auto">
                    {JSON.stringify(locataires.map(l => ({
                      id: l.id,
                      nom: l.nom,
                      prenom: l.prenom,
                      nomComplet: `${l.prenom} ${l.nom}`,
                      cin: l.cin,
                      email: l.email,
                      telephone: l.telephone
                    })), null, 2)}
                  </pre>
                </div>
              </div>
            )}
          </main>

          {/* Modale F-LOC-01 : Création avec contrôle 409 */}
          {isCreateOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop">
              <div className="bg-white rounded-2xl p-6 max-w-lg w-full space-y-4 card-shadow">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-base text-navy-700">Nouveau locataire (F-LOC-01)</h3>
                  <button onClick={() => setIsCreateOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const cinVal = form.cin.value.trim().toUpperCase();
                  if (existingCins.includes(cinVal)) {
                    alert(`Fiche refusée : CIN déjà utilisé (${cinVal}) - Erreur HTTP 409 Conflict`);
                    return;
                  }
                  const newLoc = {
                    id: "loc-" + Date.now(),
                    nom: form.nom.value.trim(),
                    prenom: form.prenom.value.trim(),
                    cin: cinVal,
                    email: form.email.value.trim(),
                    telephone: form.telephone.value.trim(),
                    hasBailActif: false,
                    bailInfo: null,
                    piecesJustificatives: [{ nom: "CIN_Copie.pdf", taille: "1.1 Mo" }]
                  };
                  setLocataires([newLoc, ...locataires]);
                  setIsCreateOpen(false);
                  showToast(`Locataire ${newLoc.prenom} ${newLoc.nom} créé avec succès !`);
                }} className="space-y-3 text-xs">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-bold block mb-1">Nom (*)</label>
                      <input name="nom" required className="w-full border p-2 rounded" placeholder="ex. Alami" />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">Prénom (*)</label>
                      <input name="prenom" required className="w-full border p-2 rounded" placeholder="ex. Karim" />
                    </div>
                  </div>
                  <div>
                    <label className="font-bold block mb-1">CIN (*) [Test doublon: AB123456]</label>
                    <input name="cin" required className="w-full border p-2 rounded font-mono uppercase" placeholder="ex. AB123456" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-bold block mb-1">Email (*)</label>
                      <input name="email" type="email" required className="w-full border p-2 rounded" placeholder="k.alami@mail.ma" />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">Téléphone (*)</label>
                      <input name="telephone" required className="w-full border p-2 rounded" placeholder="0661998877" />
                    </div>
                  </div>
                  <div className="flex justify-end space-x-2 pt-3 border-t">
                    <button type="button" onClick={() => setIsCreateOpen(false)} className="px-3 py-1.5 border rounded">Annuler</button>
                    <button type="submit" className="px-4 py-1.5 bg-navy-700 text-white rounded font-bold">Enregistrer la fiche</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modale F-LOC-03 : Détail & Quittances */}
          {detailLocataire && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop">
              <div className="bg-white rounded-2xl p-6 max-w-lg w-full space-y-4 card-shadow">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-base text-navy-700">Fiche Locataire & Quittances (F-LOC-03)</h3>
                  <button onClick={() => setDetailLocataire(null)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>
                <div className="space-y-3 text-xs">
                  <div className="p-2.5 bg-slate-50 rounded border font-mono">
                    <span className="text-slate-400 block text-[10px]">UUID SYSTÈME :</span>
                    <strong>{detailLocataire.id}</strong>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div><span className="text-slate-400 block">Locataire :</span><strong>{detailLocataire.prenom} {detailLocataire.nom}</strong></div>
                    <div><span className="text-slate-400 block">CIN vérifié :</span><strong>{detailLocataire.cin}</strong></div>
                    <div><span className="text-slate-400 block">Téléphone :</span>{detailLocataire.telephone}</div>
                    <div><span className="text-slate-400 block">Email :</span>{detailLocataire.email}</div>
                  </div>
                  <div className="p-3 bg-slate-900 text-emerald-400 rounded font-mono text-[11px]">
                    <div className="text-sky-300 font-bold mb-1">Flux JSON transmis à Quittances :</div>
                    <pre>{JSON.stringify({
                      id: detailLocataire.id,
                      nom: detailLocataire.nom,
                      prenom: detailLocataire.prenom,
                      nomComplet: `${detailLocataire.prenom} ${detailLocataire.nom}`,
                      cin: detailLocataire.cin,
                      email: detailLocataire.email,
                      telephone: detailLocataire.telephone
                    }, null, 2)}</pre>
                  </div>
                </div>
                <div className="flex justify-end pt-2 border-t">
                  <button onClick={() => setDetailLocataire(null)} className="px-4 py-1.5 bg-slate-200 rounded font-bold text-xs">Fermer</button>
                </div>
              </div>
            </div>
          )}

          {/* Modale F-LOC-04 : Modification */}
          {editLocataire && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop">
              <div className="bg-white rounded-2xl p-6 max-w-md w-full space-y-4 card-shadow">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-base text-navy-700">Modifier coordonnées (F-LOC-04)</h3>
                  <button onClick={() => setEditLocataire(null)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>
                <div className="p-2.5 bg-slate-100 rounded text-xs text-slate-600">
                  🔒 Identité ({editLocataire.prenom} {editLocataire.nom}) et CIN ({editLocataire.cin}) verrouillés.
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  setLocataires(locataires.map(l => l.id === editLocataire.id ? {
                    ...l,
                    email: form.email.value.trim(),
                    telephone: form.telephone.value.trim()
                  } : l));
                  setEditLocataire(null);
                  showToast("Coordonnées modifiées avec succès !");
                }} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold block mb-1">Nouvel email (*)</label>
                    <input name="email" defaultValue={editLocataire.email} required className="w-full border p-2 rounded" />
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Nouveau téléphone (*)</label>
                    <input name="telephone" defaultValue={editLocataire.telephone} required className="w-full border p-2 rounded" />
                  </div>
                  <div className="flex justify-end space-x-2 pt-3 border-t">
                    <button type="button" onClick={() => setEditLocataire(null)} className="px-3 py-1.5 border rounded">Annuler</button>
                    <button type="submit" className="px-4 py-1.5 bg-navy-700 text-white rounded font-bold">Enregistrer</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modale F-LOC-05 : Suppression sécurisée */}
          {deleteLocataire && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop">
              <div className="bg-white rounded-2xl p-6 max-w-md w-full space-y-4 card-shadow">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-base text-navy-700">Suppression sécurisée (F-LOC-05)</h3>
                  <button onClick={() => setDeleteLocataire(null)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>
                {deleteLocataire.hasBailActif ? (
                  <div className="space-y-3 text-xs">
                    <div className="p-3 bg-amber-50 border border-amber-300 rounded-xl text-amber-900">
                      <strong>⚠️ Suppression impossible :</strong> Ce locataire a un <strong>bail actif en cours</strong> ({deleteLocataire.bailInfo?.appartement}).
                    </div>
                    <p className="text-slate-500">Règle de gestion : Résiliez le bail dans le module Biens avant de supprimer cette fiche.</p>
                    <div className="flex justify-end pt-2">
                      <button onClick={() => setDeleteLocataire(null)} className="px-4 py-2 bg-slate-200 rounded font-bold text-xs">Compris / Fermer</button>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-3 text-xs">
                    <p className="text-slate-700">Confirmez-vous la suppression de <strong>{deleteLocataire.prenom} {deleteLocataire.nom}</strong> (CIN: {deleteLocataire.cin}) ?</p>
                    <div className="flex justify-end space-x-2 pt-2 border-t">
                      <button onClick={() => setDeleteLocataire(null)} className="px-3 py-1.5 border rounded">Annuler</button>
                      <button onClick={() => {
                        setLocataires(locataires.filter(l => l.id !== deleteLocataire.id));
                        setDeleteLocataire(null);
                        showToast("Locataire supprimé.");
                      }} className="px-4 py-1.5 bg-red-600 text-white rounded font-bold">Supprimer définitivement</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
