name: darloc-mailpit
services:
  mailpit:
    image: axllent/mailpit:v1.30.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
    volumes:
      - mailpit_data:/data
volumes:
  mailpit_data:
